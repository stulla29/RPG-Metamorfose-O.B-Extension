<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor RPG</title>
<style>
  :root {
    --bg: #1c1f26;
    --card: #262a33;
    --line: #353a46;
    --text: #e8eaf0;
    --muted: #8d94a5;
    --track: #14161b;
    --pv: #d9485b;
    --ts: #7b6cf0;
    --mun: #e0a63a;
    --pj: #4fb286;
    --npc: #5b9bd5;
    --ini: #d9485b;
  }
  :root[data-theme="light"] {
    --bg: #f1f2f5;
    --card: #ffffff;
    --line: #d8dbe3;
    --text: #1d2029;
    --muted: #6a7184;
    --track: #e4e6ec;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px; border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  button {
    font: inherit; color: inherit; cursor: pointer;
    background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--ts); outline-offset: 1px; }
  .primary { background: var(--ts); border-color: var(--ts); color: #fff; font-weight: 600; }
  .primary:hover { filter: brightness(1.1); border-color: var(--ts); }
  .danger { color: var(--pv); }

  main { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .vazio { color: var(--muted); text-align: center; margin: 40px 16px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .topo { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .nome { flex: 1; font-weight: 650; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; color: #fff; }
  .tag.PJ { background: var(--pj); }
  .tag.NPC { background: var(--npc); }
  .tag.INI { background: var(--ini); }
  .editar { padding: 2px 8px; color: var(--muted); }

  .linha { display: grid; grid-template-columns: 26px 1fr 54px 52px; align-items: center; gap: 8px; margin-top: 6px; }
  .sigla { font-weight: 700; font-size: 12px; color: var(--muted); }
  .barra { height: 12px; background: var(--track); border-radius: 99px; overflow: hidden; }
  .barra > i { display: block; height: 100%; border-radius: 99px; transition: width .2s ease; }
  .pv i { background: var(--pv); }
  .ts i { background: var(--ts); }
  .pv.baixo i { animation: pulsa 1.2s ease-in-out infinite; }
  @keyframes pulsa { 50% { opacity: .45; } }
  @media (prefers-reduced-motion: reduce) { .barra > i { transition: none; } .pv.baixo i { animation: none; } }
  .valor { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .ajuste { display: flex; gap: 3px; justify-content: flex-end; }
  .ajuste button { padding: 0; width: 24px; height: 24px; line-height: 1; }

  .arma { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px;
          margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); }
  .arma .tipo { color: var(--muted); }
  .balas { display: flex; flex-wrap: wrap; gap: 2px; max-width: 120px; }
  .balas b { width: 6px; height: 12px; border-radius: 2px; background: var(--mun); }
  .balas b.vazia { background: var(--track); }
  .mun-num { font-variant-numeric: tabular-nums; font-weight: 650; color: var(--mun); }
  .sem-arma { color: var(--muted); }

  form { display: grid; gap: 8px; }
  label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
  input, select {
    font: inherit; color: var(--text); background: var(--track);
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%;
  }
  .par { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .acoes { display: flex; gap: 8px; justify-content: space-between; margin-top: 4px; }
  .acoes div { display: flex; gap: 8px; }
  footer { padding: 6px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>Monitor</h1>
  <button class="primary" id="novo">+ Novo</button>
</header>
<main id="lista"></main>
<footer>Shift + clique ajusta de 5 em 5</footer>

<script type="module">
import OBR from "https://cdn.jsdelivr.net/npm/@owlbear-rodeo/sdk@3/+esm";

const CHAVE = "com.monitor-rpg/dados";
let personagens = [];
let editando = null; // id em edição (ou null)

const $lista = document.getElementById("lista");
const uid = () => Math.random().toString(36).slice(2, 9);
const limita = (v, min, max) => Math.max(min, Math.min(max, v));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pct = (v, max) => max > 0 ? Math.round((v / max) * 100) : 0;

/* ---------- Dados ---------- */
async function salvar() {
  await OBR.room.setMetadata({ [CHAVE]: { personagens } });
}
function carregar(meta) {
  personagens = (meta && meta[CHAVE] && meta[CHAVE].personagens) || [];
  if (editando === null) desenhar();
}

/* ---------- Telas ---------- */
function desenhar() {
  if (editando !== null) { desenharForm(); return; }
  if (!personagens.length) {
    $lista.innerHTML = `<p class="vazio">Nenhum personagem ainda.<br>Toque em “+ Novo” para adicionar.</p>`;
    return;
  }
  $lista.innerHTML = personagens.map(cartao).join("");
}

function linhaBarra(p, campo, sigla, maxCampo) {
  const v = p[campo], max = p[maxCampo];
  const baixo = campo === "pv" && max > 0 && v / max <= 0.25 ? " baixo" : "";
  return `
    <div class="linha">
      <span class="sigla">${sigla}</span>
      <div class="barra ${campo}${baixo}"><i style="width:${pct(v, max)}%"></i></div>
      <span class="valor">${v}/${max}</span>
      <span class="ajuste">
        <button data-acao="ajustar" data-id="${p.id}" data-campo="${campo}" data-d="-1" aria-label="Diminuir ${sigla}">−</button>
        <button data-acao="ajustar" data-id="${p.id}" data-campo="${campo}" data-d="1" aria-label="Aumentar ${sigla}">+</button>
      </span>
    </div>`;
}

function cartao(p) {
  let arma;
  if (p.arma || p.munMax > 0) {
    const balas = p.munMax <= 30
      ? `<span class="balas" aria-hidden="true">${Array.from({ length: p.munMax }, (_, i) => `<b class="${i < p.mun ? "" : "vazia"}"></b>`).join("")}</span>`
      : "";
    arma = `
      <div class="arma">
        <div><div>${esc(p.arma) || '<span class="sem-arma">Sem arma</span>'}</div>${balas}</div>
        <span class="mun-num">${p.mun}/${p.munMax}</span>
        <span class="ajuste">
          <button data-acao="ajustar" data-id="${p.id}" data-campo="mun" data-d="-1" aria-label="Disparar">−</button>
          <button data-acao="recarregar" data-id="${p.id}" aria-label="Recarregar" title="Recarregar">↻</button>
        </span>
      </div>`;
  } else {
    arma = `<div class="arma"><span class="sem-arma">Sem arma</span></div>`;
  }
  return `
    <section class="card">
      <div class="topo">
        <span class="nome" title="${esc(p.nome)}">${esc(p.nome) || "Sem nome"}</span>
        <span class="tag ${p.tipo}">${p.tipo}</span>
        <button class="editar" data-acao="editar" data-id="${p.id}" aria-label="Editar ${esc(p.nome)}">Editar</button>
      </div>
      ${linhaBarra(p, "pv", "PV", "pvMax")}
      ${linhaBarra(p, "ts", "TS", "tsMax")}
      ${arma}
    </section>`;
}

function desenharForm() {
  const p = personagens.find(x => x.id === editando);
  if (!p) { editando = null; desenhar(); return; }
  $lista.innerHTML = `
    <form class="card" id="form">
      <label>Nome<input name="nome" value="${esc(p.nome)}" placeholder="Ex.: Marina" autofocus></label>
      <label>Tipo
        <select name="tipo">
          ${["PJ", "NPC", "INI"].map(t => `<option ${p.tipo === t ? "selected" : ""}>${t}</option>`).join("")}
        </select>
      </label>
      <div class="par">
        <label>PV máx.<input type="number" name="pvMax" min="1" value="${p.pvMax}"></label>
        <label>TS máx.<input type="number" name="tsMax" min="1" value="${p.tsMax}"></label>
      </div>
      <label>Arma<input name="arma" value="${esc(p.arma)}" placeholder="Ex.: Pistola 9mm"></label>
      <label>Munição máx.<input type="number" name="munMax" min="0" value="${p.munMax}"></label>
      <div class="acoes">
        <button type="button" class="danger" data-acao="excluir" data-id="${p.id}">Excluir</button>
        <div>
          <button type="button" data-acao="cancelar">Cancelar</button>
          <button type="submit" class="primary">Salvar</button>
        </div>
      </div>
    </form>`;
}

/* ---------- Ações ---------- */
document.getElementById("novo").addEventListener("click", () => {
  const p = { id: uid(), nome: "", tipo: "PJ", pv: 10, pvMax: 10, ts: 10, tsMax: 10, arma: "", mun: 0, munMax: 0 };
  personagens.push(p);
  editando = p.id;
  desenhar();
});

$lista.addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-acao]");
  if (!b) return;
  const { acao, id, campo, d } = b.dataset;
  const p = personagens.find(x => x.id === id);

  if (acao === "ajustar" && p) {
    const passo = (Number(d) || 0) * (e.shiftKey ? 5 : 1);
    const max = campo === "mun" ? p.munMax : p[campo + "Max"];
    p[campo] = limita(p[campo] + passo, 0, max);
    desenhar(); await salvar();
  } else if (acao === "recarregar" && p) {
    p.mun = p.munMax;
    desenhar(); await salvar();
  } else if (acao === "editar") {
    editando = id; desenhar();
  } else if (acao === "cancelar") {
    // descarta personagem recém-criado e ainda sem nome
    const novo = personagens.find(x => x.id === editando);
    if (novo && !novo.nome && !novo.arma) personagens = personagens.filter(x => x !== novo);
    editando = null; desenhar();
  } else if (acao === "excluir") {
    personagens = personagens.filter(x => x.id !== id);
    editando = null; desenhar(); await salvar();
  }
});

$lista.addEventListener("submit", async (e) => {
  e.preventDefault();
  const p = personagens.find(x => x.id === editando);
  if (!p) return;
  const f = new FormData(e.target);
  p.nome = String(f.get("nome")).trim();
  p.tipo = f.get("tipo");
  p.arma = String(f.get("arma")).trim();
  const antigoPv = p.pvMax, antigoTs = p.tsMax, antigaMun = p.munMax;
  p.pvMax = Math.max(1, parseInt(f.get("pvMax")) || 1);
  p.tsMax = Math.max(1, parseInt(f.get("tsMax")) || 1);
  p.munMax = Math.max(0, parseInt(f.get("munMax")) || 0);
  // Personagem novo começa cheio; senão apenas respeita o novo limite
  const novo = p.pv === antigoPv && p.ts === antigoTs && p.mun === antigaMun;
  p.pv = novo ? p.pvMax : limita(p.pv, 0, p.pvMax);
  p.ts = novo ? p.tsMax : limita(p.ts, 0, p.tsMax);
  p.mun = novo ? p.munMax : limita(p.mun, 0, p.munMax);
  editando = null; desenhar(); await salvar();
});

/* ---------- Início ---------- */
OBR.onReady(async () => {
  const aplicaTema = (t) => document.documentElement.dataset.theme = t.mode === "LIGHT" ? "light" : "dark";
  aplicaTema(await OBR.theme.getTheme());
  OBR.theme.onChange(aplicaTema);

  carregar(await OBR.room.getMetadata());
  OBR.room.onMetadataChange(carregar);
});
</script>
</body>
</html>
